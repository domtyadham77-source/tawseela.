<style>

body{margin:0;font-family:'Cairo',system-ui,sans-serif;color:var(--ink);line-height:1.6;min-height:100vh;

    else if(ptrs.size===2){
      const o=[...ptrs.values()];const oldD=Math.hypot(o[0].x-o[1].x,o[0].y-o[1].y),oldM={x:(o[0].x+o[1].x)/2,y:(o[0].y+o[1].y)/2};
      ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
      const n=[...ptrs.values()];const nd=Math.hypot(n[0].x-n[1].x,n[0].y-n[1].y),nm={x:(n[0].x+n[1].x)/2,y:(n[0].y+n[1].y)/2};

function zoomAt(mx,my,f){const n=Math.min(4,Math.max(.3,sc*f));f=n/sc;tx=mx-(mx-tx)*f;ty=my-(my-ty)*f;sc=n}

function visBox(){const h=$('.hwrap');return{w:innerWidth,h:Math.max(220,innerHeight-(h?h.offsetHeight:300))}}

function fitPts(pts){
  if(!pts.length)return overview();
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),pad=70;
  const x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad,w=x1-x0,h=y1-y0;

const blockOf=(cat,n)=>{const c=CAND[cat.id];return c.find(k=>BLOCKS[k].includes(n))||c[0]};
function catOfBN(k,n){
  const L=k[0],num=+k.slice(1);let id;
  if(L==='A')id=n>=59&&n<=108?'bqasr':n<=799?'b700':n<=899?'b800':'b900';
  else if(L==='B')id=n>=601?'u600':n>=501?'u500':n>=401?'u400':'uold';
  else if((num>=1&&num<=5)||k==='C13')id='t100';
  else if(num>=6&&num<=11)id='tshr';
  else if(k==='C12')id='tcmd';
  else if(k==='C14')id=n>=186?'t100':'text';
  else id=n>=201?'t200':'told';
  return catById(id);
}
function hash(s){let h=0;for(const ch of s)h=(h*31+ch.codePointAt(0))>>>0;return h.toString(36)}

    return ZONES.some(x=>x.id===z)&&n?{id:'c'+hash(s),z,n,e:PLACE_EMOJI,custom:s}:null}).filter(Boolean);
  return PLACES.concat(extra);
}

const locP=(p,gate)=>({id:`p:${p.id}${gate?':'+gate:''}`,kind:'p',z:p.z,label:`${zn(p.z)} • ${p.n}${gate?' – بوابة '+gate:''}`,place:p});
function resolveLoc(id){

}
const locPoint=l=>!l?null:l.kind==='b'?center(l.block):(l.place&&l.place.at)||null;
const AR='٠١٢٣٤٥٦٧٨٩';
const norm=s=>String(s||'').replace(/[٠-٩]/g,d=>AR.indexOf(d)).toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064B-\u0652\u0640]/g,'').replace(/\s+/g,' ').trim();
function searchLocs(q){
  const nq=norm(q);if(!nq)return[];
  const out=[];
  for(const c of BCATS)if(norm(c.n).includes(nq))out.push({t:'cat',c});
  if(/^\d+$/.test(nq)){
    const n=+nq,ex=[],pre=[];
    for(const c of BCATS)for(let i=c.a;i<=c.b;i++){if(i===n)ex.push({t:'b',c,n:i});else if(nq.length>=2&&String(i).startsWith(nq))pre.push({t:'b',c,n:i})}
    out.push(...ex,...pre.slice(0,30));

  for(const p of allPlaces())if(norm(p.n).includes(nq))out.push({t:'p',p});

}

const admOpen=new Set();
const admKey=h=>[...h.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join('').trim().replace(/\s*\(.*?\)\s*$/,'').slice(0,60);
function adminCollapse(){
  document.querySelectorAll('#app .card').forEach(card=>{
    const h=card.querySelector(':scope > h2'); if(!h) return;
    const open=admOpen.has(admKey(h));
    [...card.children].forEach(c=>{if(c!==h)c.style.display=open?'':'none'});
    h.querySelectorAll('.arw').forEach(x=>x.remove());
    const btn=document.createElement('button');btn.type='button';btn.className='arw'+(open?' open':'');btn.textContent='⌄';
    btn.setAttribute('aria-label','افتح أو اقفل القسم');
    h.appendChild(btn);h.style.cursor='pointer';
  });
}
document.addEventListener('click',e=>{
  const h=e.target.closest&&e.target.closest('#app .card > h2');
  if(!h||!document.body.classList.contains('adm'))return;
  const k=admKey(h);
  if(admOpen.has(k))admOpen.delete(k);else admOpen.add(k);
  adminCollapse();
});
function render(){
  const adm=isAdmin(),role=adm?null:curRole();
  const pgIn=animNext;animNext=false;
  const dirCls=animDir?' dir-'+animDir:'';animDir=null;
  const ml=document.querySelector('link[rel=manifest]');if(ml)ml.href=adm?'/manifest-admin.json':'/manifest.json';
  document.body.classList.toggle('adm',adm);
  document.body.classList.toggle('drv',tab==='driver');
  document.body.classList.toggle('home',!adm&&!!role);
  document.body.classList.toggle('landing',!adm&&!role);
  $('#sub').textContent=adm?'لوحة التحكم':'توصيل داخل المدينة';
  $('#heroText').innerHTML=adm||role?'':tab==='rider'
    ?'<b>من عمارتك لحد وجهتك</b><span>اطلب كابتن في ثواني وادفع كاش</span>'
    :'<b>اشتغل واكسب جوه مدينتك</b><span>سجّل بياناتك واستلم طلبات الركاب</span>';
  $('#tabs').innerHTML=adm||role?'':[['rider','راكب'],['driver','كابتن']].map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
  if(role){$('#app').innerHTML='';renderHome();}
  else{
    let html=adm?adminView():tab==='driver'?driverLogin():riderLogin();
    if(!adm)html=`<div class="stage${pgIn?' pg-in':''}${dirCls}">${scene()}<div class="stage-in">${html}<div class="credit">Designed by ادهم</div></div></div>`;
    const saved=grabForm();$('#app').innerHTML=html;restoreForm(saved);
    if(adm)adminCollapse();
    if(regMode&&editingDriverId)prefillEdit();
  }
  if(modalFn&&$('#modal').classList.contains('on'))$('#modalIn').innerHTML=modalFn();
  setConn(conn);
}

function riderSheet(){

  const mine=S.trips.filter(t=>t.riderId===r.id).sort((a,b)=>b.at-a.at);
  const cur=riderTrip();
  const unrated=mine.find(t=>t.status==='done'&&!t.rating);
  let h='<div class="grab"></div>';
  if(cur) return h+`<div class="sh-t"><b>رحلتك</b><span class="badge">${esc(catOf(cur.cat).name)}</span></div>`+tripRider(cur);

function paintSlots(){

function compress(file){return new Promise((ok,no)=>{
  const fr=new FileReader();
  fr.onerror=no;
  fr.onload=()=>{const img=new Image();img.onerror=no;
    img.onload=()=>{const sc2=Math.min(1,800/Math.max(img.width,img.height));const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc2));c.height=Math.max(1,Math.round(img.height*sc2));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};
    img.src=fr.result};
  fr.readAsDataURL(file)})}
async function handleFiles(files){
  const t=pickT;pickT=null;const list=[...files];
  if(!t||!list.length)return;
  const d=DOCS[t.doc];
  for(let i=0;i<list.length;i++){
    const slot=i===0&&t.slot?t.slot:d.slots.find(k=>!tmp[k]);
    if(!slot)break;
    try{tmp[slot]=await compress(list[i])}catch(e){toast('الصورة مش مقروءة، جرّب صورة تانية',1)}
    paintSlots();
  }
}

const bldId=(k,n)=>'b:'+catOfBN(k,n).id+':'+n;
function saveGPS(id){
  if(!window.isSecureContext||!navigator.geolocation) return toast('الـ GPS محتاج الموقع يتفتح على https',1);
  toast('جاري تحديد مكانك…');
  navigator.geolocation.getCurrentPosition(pos=>{
    const la=pos.coords.latitude,ln=pos.coords.longitude,acc=Math.round(pos.coords.accuracy||999);
    if(acc>50) return toast('الدقة قليلة ('+acc+' متر). قرّب من باب العمارة وجرّب تاني',1);
    S.coords=S.coords||{};S.coords[id]=[+la.toFixed(6),+ln.toFixed(6),acc,driverId,Date.now()];
    toast('تم حفظ مكان العمارة ✓');commit();
  },()=>toast('مقدرناش نجيب موقعك. اتأكد إن الـ GPS شغال واديت الموقع إذن',1),{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function gpsBtn(id,label){
  if(!id) return '';
  if(S.coords&&S.coords[id]) return `<div class="small">✓ مكان ${esc(label)} متسجّل</div>`;
  return `<button class="btn ghost" onclick="saveGPS('${esc(id)}')">احفظ مكان ${esc(label)} بالـ GPS</button>`;
}
function missingBuildings(){
  const out=[];
  for(const k in BLOCKS)for(const n of BLOCKS[k]){const id=bldId(k,n);
    if(!(S.coords&&S.coords[id])&&!COORDS[id]) out.push({id,k,n});}
  return out;
}
function navUrl(fromId,toId,fromLabel,toLabel){
  const pt=id=>{const c=S.coords&&S.coords[id];if(c)return c[0]+','+c[1];return COORDS[id]?COORDS[id].join(','):null};
  const txt=x=>encodeURIComponent(String(x||'').replace(/•/g,' ').replace(/\s+/g,' ').trim()+' Future City New Cairo');
  const o=pt(fromId)||txt(fromLabel),d=pt(toId)||txt(toLabel);
  return 'https://www.google.com/maps/dir/?api=1&origin='+o+'&destination='+d+'&travelmode=driving';
}
function curTrip(t){
  const r=S.riders.find(x=>x.id===t.riderId);
  const next={accepted:['وصلت للراكب','arrived'],arrived:['بدأت الرحلة','started']}[t.status];
  return `<div class="card"><h2>رحلة شغّالة</h2><b>${esc(t.from)} ← ${esc(t.to)}</b>
    <div class="small">الراكب: ${esc(r?.name)} • <span class="badge b-wait">${ST[t.status]}</span></div>
    <div class="ticket"><svg class="ic"><use href="#ic-pin"/></svg><div><div class="small" style="color:#fff">حصّل كاش</div><b>${price(t)}</b> جنيه</div>
      <div class="small" style="color:#fff;text-align:left">${t.stops} وقفة</div></div>
    <div class="row">${chatBtn(t,'driver','تواصل مع الراكب')}<a class="btn ghost" href="tel:${esc(r?.phone||'')}">📞 رن عليه</a></div>
    ${t.status==='arrived'?gpsBtn(t.fromId,'الراكب'):''}${t.status==='started'?gpsBtn(t.toId,'الوجهة'):''}
    ${openChat===t.id?chatPanel(t,'driver'):''}
    ${next?`<button class="btn" onclick="setStatus(${t.id},'${next[1]}')">${next[0]}</button>`
      :`<div class="row"><button class="btn ghost" onclick="addStop(${t.id})">وقفة (+${S.settings.stop})</button><button class="btn green" onclick="setStatus(${t.id},'done')">انتهت الرحلة</button></div>`}
    ${t.status==='accepted'?`<button class="btn ghost" onclick="releaseTrip(${t.id})">مقدرش أكمّل الرحلة دي</button>`:''}</div>`;
}
function acceptTrip(id){
  const t=S.trips.find(x=>x.id===id);
  if(!t||t.status!=='requested') return toast('الرحلة اتاخدت',1);
  t.status='accepted';t.driverId=driverId;t.eta=+val('eta-'+id)||5;
  post.push(()=>{const x=S.trips.find(y=>y.id===id);if(x&&x.driverId!==driverId){toast('الرحلة اتاخدت من كابتن تاني',1);render()}});
  commit();
}
function releaseTrip(id){openCancel(id,'driver');return;const t=S.trips.find(x=>x.id===id);t.status='requested';t.driverId=null;t.eta=null;openChat=null;commit()}
function setStatus(id,s){const t=S.trips.find(x=>x.id===id);t.status=s;if(s==='done')t.doneAt=Date.now();commit()}
function addStop(id){S.trips.find(x=>x.id===id).stops++;commit()}
function driverPay(d){
  const pend=S.payments.find(p=>p.driverId===d.id&&p.status==='review');
  if(pend) return `<div class="card"><h2>الدفع قيد التأكيد</h2><p>استلمنا بيانات تحويلك (${esc(pend.ref)}). هنفعّل الاشتراك أول ما نتأكد.</p></div>`;
  return `<div class="card"><h2>اشتراك الشهر: ${money(S.settings.sub)}</h2>
    <p class="small">ادفع الاشتراك لصاحب الموقع، وبعدها اكتب بيانات التحويل.</p>
    <div class="chips">${Object.keys(WALLET).map(k=>`<button class="chip ${method===k?'on':''}" onclick="method='${k}';render()">${WALLET[k]}</button>`).join('')}</div>
    <div class="ticket"><svg class="ic"><use href="#ic-pin"/></svg><div><div class="small" style="color:#fff">حوّل على ${WALLET[method]}</div><b style="font-size:22px" dir="ltr">${esc(S.settings.wallets[method])}</b></div></div>
    <label for="pr">رقم العملية أو الرقم اللي حوّلت منه</label><input id="pr">
    <button class="btn" onclick="sendPay()">أكدت التحويل</button></div>`;

function sendPay(){
  const ref=val('pr');if(ref.length<4) return toast('اكتب رقم العملية أو رقم المحفظة',1);
  if(S.payments.some(p=>p.driverId===driverId&&p.status==='review')) return;
  S.payments.push({id:uid(),driverId,method,ref,amount:S.settings.sub,status:'review',at:Date.now()});commit();
}

function addNotice(d,kind,reason,days){
  const first=(d.name||'').trim().split(/\s+/)[0]||'يا صديقي';
  let text;
  if(kind==='deleted') text='أهلاً '+first+'، للأسف اتشال حسابك من توصيلة بسبب: '+reason+'. شكراً لاستخدامك توصيلة، ونتمنى تكون تجربتك أحسن في أي وقت.';
  else if(kind==='blocked') text='أهلاً '+first+'، تم حظرك من توصيلة لمدة '+days+(days===1?' يوم':' أيام')+' بسبب: '+reason+'. نأمل إن المشكلة دي متتكررش تاني لما ترجع، ونشكرك على تفهمك واحترامك للمنصة.';
  else text='أهلاً '+first+'، تم حظرك من توصيلة نهائياً بسبب: '+reason+'. شكراً لاستخدامك توصيلة.';
  S.settings.notices=(S.settings.notices||[]).concat([{phone:d.phone,name:d.name,nid:d.nid||'',kind,text,at:Date.now()}]).slice(-200);
}
function noticeFor(phone){
  const list=(S.settings&&S.settings.notices)||[];
  for(let i=list.length-1;i>=0;i--) if(list[i].phone===phone) return list[i];
  return null;
}
function openNotice(text){
  modalFn=null;
  $('#modalIn').innerHTML=`<div class="pk-h"><h3>رسالة من توصيلة</h3><button class="x" onclick="closeModal()" aria-label="إغلاق">×</button></div>
    <p style="font-size:16px;line-height:1.9;margin:8px 0 14px">${esc(text)}</p>
    <button class="btn" onclick="closeModal()">تمام</button>`;
  $('#modal').classList.add('on');
}
function adminDelete(coll,id,label){
  const word=prompt('عشان تأكد الحذف: هتمسح '+label+'. اكتب كلمة "امسح" بالظبط:');
  if(word!=='امسح'){toast('الحذف اتلغى، ماتمسحش حاجة',1);return}
  S[coll]=(S[coll]||[]).filter(x=>x.id!==id);
  S.removedRec=S.removedRec||{};
  S.removedRec[coll]=(S.removedRec[coll]||[]).concat([id]);
  toast('اتمسح '+label);commit();
}

function postAnnouncement(){
  const raw=val('annText');
  if(!raw) return toast('اكتب الرسالة',1);
  // اللينك بيتلقط من الرسالة نفسها: أول https:// بيتحط كزرار تحميل، والباقي رسالة
  const m=raw.match(/https?:\/\/[^\s]+/);
  const link=m?m[0].slice(0,300):'';
  const text=(m?raw.replace(m[0],''):raw).replace(/\s+/g,' ').trim();
  if(!text&&!link) return toast('اكتب رسالة',1);
  S.settings.announcements=(S.settings.announcements||[]).concat([{id:uid(),text:text.slice(0,1000),link,at:Date.now()}]).slice(-100);
  $('#annText').value='';
  toast('اتنشرت للكل ✓');commit();
}
function adminDelDriver(id){
  const d=S.drivers.find(x=>x.id===id);if(!d)return;
  if(!confirm('امسح الكابتن ('+d.name+')؟ مش هيقدر يرجع غير لو سجّل من جديد.')) return;
  const reason=(prompt('سبب الحذف (هيوصل للكابتن في رسالة):','مخالفة لقواعد توصيلة')||'مخالفة لقواعد توصيلة').trim();
  addNotice(d,'deleted',reason,0);
  S.drivers=S.drivers.filter(x=>x.id!==id);
  S.removedDrivers=(S.removedDrivers||[]).concat([id]);
  toast('اتمسح الكابتن');commit();
}
function adminBlockDriver(id){
  const d=S.drivers.find(x=>x.id===id);if(!d)return;
  const days=+val('bd-'+id)||0;
  const until=days?Date.now()+days*864e5:0;
  const reason=(prompt('سبب الحظر (هيوصل للكابتن في رسالة):','المشكلة اللي حصلت')||'المشكلة اللي حصلت').trim();
  addNotice(d,days?'blocked':'banned',reason,days);
  S.settings.blocks=(S.settings.blocks||[]).concat([{phone:d.phone,name:d.name,nid:d.nid||'',until,at:Date.now()}]);
  S.drivers=S.drivers.filter(x=>x.id!==id);
  S.removedDrivers=(S.removedDrivers||[]).concat([id]);
  toast(days?'اتحظر لمدة '+days+' يوم':'اتحظر نهائياً');commit();
}
function adminUnblock(i){
  if(!S.settings.blocks||!S.settings.blocks[i])return;
  S.settings.blocks.splice(i,1);toast('اترفع الحظر');commit();

    <div class="bgrid">${miss.slice(0,80).map(x=>`<span class="bchip" style="cursor:default"><b>${esc(x.n)}</b><small>${x.k}</small></span>`).join('')}</div>${miss.length>80?`<p class="small">وغيرهم ${miss.length-80}</p>`:''}</div>`;
  const w=S.settings.wallets;
  return `<button class="btn ghost" style="margin:0 0 14px" onclick="adminLogout()">تسجيل خروج</button>
  <div class="stat"><div><b>${S.drivers.filter(driverActive).length}</b>كابتن مفعّل</div><div><b>${S.trips.filter(t=>t.status==='done').length}</b>رحلة خلصت</div><div><b>${rev}</b>إيراد الاشتراكات</div></div>
  <div class="card"><h2>كباتن محتاجين مراجعة (${pend.length})</h2>${pend.length?pend.map(d=>`<div class="trip"><b>${esc(d.name)}</b>
    <div class="small">${esc(d.phone)} • ${esc(catOf(d.cat).name)} • بطاقة ${esc(d.nid)} • رخصة ${esc(d.license)}</div>

    <div class="row"><button class="btn ghost" onclick="setFace(${d.id},'yes')">✅ الصورة مطابقة للبطاقة</button><button class="btn ghost" onclick="setFace(${d.id},'no')">❌ مش مطابقة</button></div>
    <div class="row"><button class="btn green" onclick="reviewDriver(${d.id},true)">قبول</button><button class="btn red" onclick="reviewDriver(${d.id},false)">رفض</button></div></div>`).join(''):'<p class="small">مفيش طلبات.</p>'}</div>

    <div class="small">${s.n?`التقييم: ★ ${s.avg} (${s.n} تقييم)`:'لسه مفيش تقييمات'}</div>

  ${driversCard}
  <div class="card"><h2>الركاب (${S.riders.length})</h2>${S.riders.length?S.riders.slice().map(r=>`<div class="trip"><b>${esc(r.name)}</b><div class="small">${esc(r.phone)} • ${esc(r.email||'')}</div><div class="row"><button class="btn red" style="margin:4px 0 0" onclick="adminDelRider(${r.id})">🗑 امسح الراكب</button></div></div>`).join(''):'<p class="small">مفيش ركاب لسه.</p>'}</div>

    <div><label for="ss">سعر الوقفة</label><input id="ss" type="number" value="${S.settings.stop}"></div>
    <div><label for="su">الاشتراك</label><input id="su" type="number" value="${S.settings.sub}"></div></div>

    <button class="btn" onclick="saveSettings()">حفظ</button></div>
  <div class="card"><h2>أماكن إضافية</h2><p class="small">الأماكن الأساسية متظبطة. هنا تضيف مكان جديد يظهر للركاب في المنطقة اللي تختارها.</p>
    <div class="row"><select id="npz">${ZONES.map(z=>`<option value="${z.id}">${z.n}</option>`).join('')}</select><input id="npn" placeholder="اسم المكان"></div>
    <button class="btn" onclick="addPlace()">إضافة مكان</button>
    ${(S.buildings||[]).map((b,i)=>({b,i})).filter(x=>x.b.includes('|')).map(x=>{const k=x.b.indexOf('|');return `<div class="trip"><b>${esc(x.b.slice(k+1))}</b> <span class="small">• ${zn(x.b.slice(0,k))}</span> <button class="chip" style="flex:none;margin-inline-start:8px" onclick="delPlace(${x.i})">حذف</button></div>`}).join('')}</div>`;
}
function dstat(d){
  const mine=S.trips.filter(t=>t.driverId===d.id);
  const busy=mine.some(t=>LIVE.includes(t.status));
  const done=mine.filter(t=>t.status==='done');
  const midnight=new Date().setHours(0,0,0,0);
  const rated=done.filter(t=>t.rating);
  const avg=rated.length?(rated.reduce((a,t)=>a+t.rating,0)/rated.length).toFixed(1):0;
  return {label:busy?'في رحلة دلوقتي':driverActive(d)?'فاضي':'اشتراكه منتهي',cls:busy?'b-wait':driverActive(d)?'b-ok':'b-bad',
    today:done.filter(t=>t.doneAt>=midnight).length,total:done.length,n:rated.length,avg,
    comments:rated.filter(t=>t.comment).slice(-3).map(t=>t.rating+'★ '+t.comment)};
}
async function adminLogin(){
  const pin=val('pin');
  if(REMOTE){
    try{
      const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
      const j=await r.json();if(!j.ok) return toast('الرمز غلط',1);
      adminPin=pin;adminOK=true;lastFP='';await pull();
    }catch(e){return toast('مفيش اتصال بالسيرفر',1)}
  }else{
    if(pin!==S.settings.pin) return toast('الرمز غلط',1);
    adminOK=true;
  }
  render();
}
function adminLogout(){adminOK=false;adminPin='';lastFP='';render()}
function setFace(id,v){const d=S.drivers.find(x=>x.id===id);d.faceMatch=v;commit()}
function reviewDriver(id,ok){const d=S.drivers.find(x=>x.id===id);if(ok&&d.faceMatch!=='yes')return toast('لازم تأكد إن الصورة مطابقة للبطاقة الأول',1);
  if(!ok){d.reason=(prompt('سبب الرفض (هيظهر للكابتن):','البيانات أو الصور مش واضحة')||'البيانات محتاجة تصحيح').slice(0,200)}
  d.status=ok?'approved':'rejected';
  if(ok){d.subUntil=Date.now()+90*864e5;d.trialMsg=true}
  commit()}
function ackTrial(){const d=S.drivers.find(x=>x.id===driverId);if(d){localStorage.setItem('tw-trial-'+d.phone,'1');d.trialMsg=false;commit()}}
function reviewPay(id,ok){
  const p=S.payments.find(x=>x.id===id);p.status=ok?'paid':'rejected';
  if(ok){const d=S.drivers.find(x=>x.id===p.driverId);d.subUntil=Math.max(Date.now(),d.subUntil||0)+30*864e5}
  commit();
}
function saveSettings(){
  const s=S.settings;s.base=+val('sb')||30;s.stop=+val('ss')||5;s.sub=+val('su')||100;
  s.trip={short:{min:+val('sSmin')||20,max:+val('sSmax')||45},long:{min:+val('sLmin')||35,max:+val('sLmax')||50}};
  s.cats=cats().map((c,i)=>({...c,name:val('cn-'+i)||c.name,extra:Math.max(0,+val('cx-'+i)||0)}));
  Object.keys(WALLET).forEach(k=>s.wallets[k]=val('w-'+k));toast('تم الحفظ');commit();
}
function addPlace(){
  const z=val('npz'),n=val('npn');
  if(n.length<2) return toast('اكتب اسم المكان',1);
  const b=z+'|'+n;if(S.buildings.includes(b)||allPlaces().some(p=>p.z===z&&norm(p.n)===norm(n))) return toast('المكان ده موجود قبل كده',1);
  S.buildings.push(b);$('#npn').value='';commit();
}
function delPlace(i){S.buildings.splice(i,1);commit()}

// ---------- التشغيل ----------
async function init(){
  if(location.protocol==='http:'||location.protocol==='https:'){
    try{
      const r=await fetch('/api/state');
      if(r.ok&&(r.headers.get('content-type')||'').includes('json')){
        const st=await r.json();REMOTE=true;conn='ok';
        S.settings=st.settings;S.buildings=st.buildings;S.coords=st.coords||{};for(const c of COLL)S[c]=st[c]||[];
        takeSnap();lastFP=JSON.stringify(st);
        let sess={};try{sess=JSON.parse(ls.g('tw-sess')||'{}')}catch(e){}
        if(S.riders.some(x=>x.id===sess.r))riderId=sess.r;
        if(S.drivers.some(x=>x.id===sess.d))driverId=sess.d;
        if(sess.t==='driver'||sess.t==='rider')tab=sess.t;
      }
    }catch(e){}
  }
  render();
  setInterval(poll,1000);
}

// سحب الشيت لتحت عشان الخريطة تبقى كاملة (اسحب المقبض ⬇️)
let shDrag=null;
$('#hsheet').addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grab');if(!g)return;
  const el=$('#hsheet');
  shDrag={y0:e.clientY,was:el.classList.contains('collapsed'),el,y:0};
  el.classList.add('dragging');
  try{g.setPointerCapture(e.pointerId)}catch(_){}
});
window.addEventListener('pointermove',e=>{
  if(!shDrag)return;
  const h=shDrag.el.offsetHeight,base=shDrag.was?h-64:0;
  shDrag.y=Math.max(0,Math.min(h-64,base+(e.clientY-shDrag.y0)));
  shDrag.el.style.transform=`translateY(${shDrag.y}px)`;
});
window.addEventListener('pointerup',()=>{
  if(!shDrag)return;
  const el=shDrag.el,h=el.offsetHeight;
  el.classList.remove('dragging');el.style.transform='';
  el.classList.toggle('collapsed',shDrag.y>(h-64)/2);
  shDrag=null;
});

// ---------- تثبيت التطبيق على التليفون ----------
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
const isStandaloneApp=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
function installSteps(){
  return `<div class="ins-steps">
    <div class="ins-card"><b>🤖 أندرويد (Chrome)</b><ol><li>اضغط على القايمة <b>⋮</b> فوق يمين</li><li>اختار <b>تثبيت التطبيق</b> أو <b>إضافة إلى الشاشة الرئيسية</b></li><li>اضغط <b>Install</b></li></ol></div>
    <div class="ins-card"><b>🍎 آيفون (Safari)</b><ol><li>اضغط زرار المشاركة <b>⬆️</b> تحت</li><li>اختار <b>Add to Home Screen</b> (إضافة للشاشة الرئيسية)</li><li>اضغط <b>Add</b></li></ol></div>
  </div>`;
}
function showInstallPrompt(force){
  if(!force&&isStandaloneApp()) return;
  modalFn=null;
  $('#modalIn').innerHTML=`<div class="pk-h"><h3>ثبّت توصيلة على تليفونك 📲</h3><button class="x" onclick="closeModal()" aria-label="إغلاق">×</button></div>
    <p class="small">عشان توصل للتطبيق بسرعة من الشاشة الرئيسية، من غير ما تفتح المتصفح كل مرة.</p>
    ${installSteps()}
    <div class="row" style="margin-top:12px">${deferredInstall?'<button class="btn" onclick="doInstall()">ثبّته دلوقتي</button>':''}<button class="btn ghost" onclick="closeModal()">بعدين</button></div>`;
  $('#modal').classList.add('on');
}
async function doInstall(){
  if(!deferredInstall) return toast('اتبع الخطوات اللي فوق',1);
  deferredInstall.prompt();
  try{await deferredInstall.userChoice}catch(_){}
  deferredInstall=null;closeModal();
}
// الرسالة بتظهر كل مرة يفتح فيها الموقع (من المتصفح) لحد ما التطبيق يتثبّت، وبعدين مابتظهرش تاني
let installShownThisLoad=false;
window.addEventListener('appinstalled',()=>{localStorage.setItem('tw-installed','1');});
function maybeInstallPrompt(){
  if(installShownThisLoad) return;
  if(localStorage.getItem('tw-installed')) return;
  if(isStandaloneApp()) return;
  installShownThisLoad=true;
  showInstallPrompt(false);
}
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
init();
